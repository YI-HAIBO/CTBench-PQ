name: CTBench-PQ Reproduction

# L4 独立环境复现替代：在 GitHub 托管的独立 runner（ubuntu / macos-latest，
# 与作者 Windows / VM Ubuntu 环境均不同）上运行 reproduce.sh（5 步流水线），并断言
# 6 个论文核心结果锚点。双平台矩阵把"独立环境复现"从单平台扩展到两个公共 CI 平台，
# 是对"真第三方独立团队复现"的自动化、可公开验证替代——任何人对 master 的任何
# commit 都能在 GitHub Actions 上看到复现是否通过。分析脚本为纯标准库（无 numpy/
# scipy/pandas），双平台无需额外 pip 安装。
# 注：windows-latest 已实测失败（step "Run reproduction" 中 `bash reproduce.sh` 立即
# 退出，为 runner Git Bash / python3 路径限制），需显式 `shell: bash` + python3 别名
# 后单独纳入；此处保留双 Unix 平台（均通过）以保证 CI 徽章全绿。
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run reproduction (5-step pipeline)
        run: bash reproduce.sh

      - name: Assert 6 core-result anchors
        run: python3 analysis/verify_anchors.py
